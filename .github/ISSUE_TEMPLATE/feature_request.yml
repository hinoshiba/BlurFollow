name: Feature request
description: Suggest a focused masking or workflow improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What screen-masking or sharing workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Failure behavior
      description: What should BlurFollow do if tracking or capture stops?
