name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install ripgrep
        run: brew install ripgrep

      - name: Test
        run: swift test

      - name: Build app bundle
        run: ./build.sh

      - name: Verify bundle and license payload
        run: ./Scripts/check-release.sh

      - name: Validate privacy manifest
        run: plutil -lint BlurFollow/Resources/PrivacyInfo.xcprivacy
