<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>プライバシーへ移動 — BlurFollow</title>

  <link rel="canonical" href="https://blurfollow.hinoshiba.com/">
  <meta http-equiv="refresh" content="0; url=/#privacy">
  <script>
    const routes = { summary: "privacy-summary", screen: "screen", local: "local", permissions: "permissions", network: "network", choices: "choices", limits: "limitations", contact: "contact" };

    location.replace("/#" + anchor);
  </script>
</head>
