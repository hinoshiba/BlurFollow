<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>サポートへ移動 — BlurFollow</title>
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://blurfollow.app/">
  <meta http-equiv="refresh" content="0; url=/#support">
  <script>
    const routes = { start: "start", sharing: "sharing", permissions: "permissions", faq: "faq", contact: "contact" };
    const anchor = routes[location.hash.slice(1)] || "support";
    location.replace("/#" + anchor);
  </script>
</head>
<body><p><a href="/#support">統合されたサポートへ移動します。</a></p></body>
</html>
