<html lang="ja">
<head>

  <title>オープンソース情報へ移動 — BlurFollow</title>

  <link rel="canonical" href="https://blurfollow.hinoshiba.com/">

    const routes = { license: "license", dependencies: "dependencies", brand: "brand", documents: "documents" };
